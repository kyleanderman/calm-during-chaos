y=`<script>(()=>{try{const local=todayISO(),utc=new Date().toISOString().slice(0,10);if(local!==utc&&utc===addDays(local,1)){const merge=(a={},b={})=>{let out={...a};for(const [k,v] of Object.entries(b||{})){if(k==='drinks'||k==='pornMastCount')out[k]=(Number(out[k])||0)+(Number(v)||0);else if(k==='customNeg'||k==='customPos'||k==='checkins')out[k]={...(out[k]||{}),...(v||{})};else if(['mood','clarity','calm','energy','xanax'].includes(k)){if(v!=null)out[k]=v}else if(typeof v==='boolean')out[k]=Boolean(out[k]||v);else if(v!=null&&(out[k]==null||out[k]===''))out[k]=v}return out};let changed=false;if(S.start===utc){S.start=local;changed=true}if(S.days&&S.days[utc]){S.days[local]=merge(S.days[local]||{},S.days[utc]);delete S.days[utc];changed=true}if(S.health&&S.health[utc]){S.health[local]={...(S.health[local]||{}),...S.health[utc]};delete S.health[utc];changed=true}selected=local;if(changed)save();render()}}catch(e){console.error('Local date recovery',e)}})();<\/script>`;html=html.replace('</body>',recovery+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div>Could not load Calm During Chaos<small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
