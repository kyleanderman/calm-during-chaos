<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calm During Chaos">
  <link rel="manifest" href="manifest.json?v=daypill-v14">
  <link rel="apple-touch-icon" href="icon-180.png?v=daypill-v14">
  <title>Calm During Chaos</title>
  <style>
    html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-weight:800}
    #loading small{display:block;color:#7f8ba0;margin-top:8px;font-weight:500}
  </style>
</head>
<body>
<div id="loading"><div>Calm During Chaos<small>Opening your journey...</small></div></div>
<script>
(async()=>{
  const KEY='cdc-v3';
  const DAY1='2026-08-23';
  const EARLY='2026-08-22';
  const NEXT='2026-08-24';
  const MARK='cdc-native-daypill-v14';
  const CACHE_MARK='cdc-cache-reset-v14';

  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      try{
        if(!localStorage.getItem('cdc-v3-rescue-original-v14')) localStorage.setItem('cdc-v3-rescue-original-v14',raw);
        localStorage.setItem('cdc-v3-rescue-latest-v14',raw);
        localStorage.setItem('cdc-v3-rescue-meta-v14',JSON.stringify({savedAt:new Date().toISOString(),bytes:raw.length}));
      }catch(e){}

      if(!localStorage.getItem(MARK)){
        try{
          const s=JSON.parse(raw);
          s.days=s.days||{};
          s.health=s.health||{};
          const hasDay1=Object.keys(s.days[DAY1]||{}).length||Object.keys(s.health[DAY1]||{}).length;
          const move=(from)=>{
            if(s.days[from]&&!hasDay1){s.days[DAY1]=s.days[from];delete s.days[from];}
            if(s.health[from]&&!hasDay1){s.health[DAY1]=s.health[from];delete s.health[from];}
          };
          if(s.start===EARLY){move(EARLY);s.start=DAY1;}
          if(s.start===NEXT&&!hasDay1){move(NEXT);s.start=DAY1;}
          localStorage.setItem(KEY,JSON.stringify(s));
          localStorage.setItem(MARK,'1');
        }catch(e){}
      }
    }

    try{
      if('caches' in window&&!localStorage.getItem(CACHE_MARK)){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>!k.startsWith('cdc-data-rescue-')).map(k=>caches.delete(k)));
        localStorage.setItem(CACHE_MARK,'1');
      }
    }catch(e){}

    const stamp=Date.now();
    const parts=await Promise.all(['app-part-1.txt','app-part-2.txt','app-part-3.txt'].map(f=>
      fetch(f+'?v=daypill-v14-'+stamp,{cache:'no-store'}).then(r=>{
        if(!r.ok) throw new Error('Could not load app');
        return r.text();
      })
    ));

    const b64=parts.join('').replace(/\s/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Please update Safari');
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

    html=html.replace('60-DAY RESET','60-DAY JOURNEY');

    const css=`<style id="cdc-native-daypill-style">
#daypill{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#cdcDayNav{position:fixed;z-index:2147483647;display:none;gap:7px;padding:6px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(13,21,34,.98);box-shadow:0 10px 26px rgba(0,0,0,.45)}
#cdcDayNav.on{display:flex}
#cdcDayNav button{width:36px;height:34px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:#182334;color:#f2f7ff;font-size:25px;font-weight:750;line-height:1;padding:0 0 3px;display:grid;place-items:center;touch-action:manipulation}
#cdcDayNav button:active:not(:disabled){background:#25354d;transform:scale(.96)}
#cdcDayNav button:disabled{opacity:.22}
</style>`;

    const code=`(()=>{try{
const pill=document.getElementById('daypill');
if(!pill||typeof selected==='undefined'||typeof render!=='function'||typeof addDays!=='function'||typeof todayISO!=='function'||typeof S==='undefined')return;
let open=false;
const nav=document.createElement('div');
nav.id='cdcDayNav';
nav.innerHTML='<button id="cdcPrevDay" type="button" aria-label="Previous day">‹</button><button id="cdcNextDay" type="button" aria-label="Next day">›</button>';
document.body.appendChild(nav);
const prev=nav.querySelector('#cdcPrevDay'),next=nav.querySelector('#cdcNextDay');

const update=()=>{
  const today=todayISO();
  prev.disabled=!S.start||selected<=S.start;
  next.disabled=!S.start||selected>=today;
  const r=pill.getBoundingClientRect(),w=nav.offsetWidth||85;
  nav.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';
  nav.style.top=Math.min(innerHeight-50,r.bottom+6)+'px';
};

const setOpen=value=>{
  open=!!value&&!!S.start;
  nav.classList.toggle('on',open);
  if(open) requestAnimationFrame(update);
};

const go=delta=>{
  if(!S.start)return;
  const target=addDays(selected,delta),today=todayISO();
  if(target<S.start||target>today)return;
  selected=target;
  render();
  setOpen(true);
};

pill.addEventListener('click',e=>{
  e.preventDefault();
  e.stopPropagation();
  setOpen(!open);
});
prev.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(-1)});
next.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(1)});
document.addEventListener('click',e=>{if(open&&!e.target.closest('#daypill,#cdcDayNav'))setOpen(false)});
addEventListener('resize',()=>{if(open)update()});
addEventListener('scroll',()=>{if(open)update()},{passive:true});
}catch(e){console.error('Native day pill navigation',e)}})();`;

    html=html.replace('</head>',css+'</head>');
    html=html.replace('</body>','<scr'+'ipt>'+code+'</scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div>Could not load Calm During Chaos<small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
