<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#07090e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calm During Chaos"><link rel="manifest" href="manifest.json?v=day1-root-v6"><link rel="apple-touch-icon" href="icon-180.png?v=day1-root-v6"><title>Calm During Chaos</title><style>html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-weight:800}#loading small{display:block;color:#7f8ba0;margin-top:8px;font-weight:500}</style></head><body><div id="loading"><div>Calm During Chaos<small>Loading your 60-day reset…</small></div></div><script>(async()=>{const DAY1='2026-08-23',BAD_DAY2='2026-08-24',MARK='cdc-day1-root-repair-v6';const merge=(a={},b={})=>{const o={...a};for(const[k,v]of Object.entries(b||{})){if(k==='drinks'||k==='pornMastCount')o[k]=(Number(o[k])||0)+(Number(v)||0);else if(k==='customNeg'||k==='customPos'||k==='checkins')o[k]={...(o[k]||{}),...(v||{})};else if(['mood','clarity','calm','energy','xanax'].includes(k)){if(v!=null)o[k]=v}else if(typeof v==='boolean')o[k]=Boolean(o[k]||v);else if(v!=null&&(o[k]==null||o[k]===''))o[k]=v}return o};try{try{const raw=localStorage.getItem('cdc-v3');if(raw&&!localStorage.getItem(MARK)){const s=JSON.parse(raw);s.days=s.days||{};s.health=s.health||{};const startLooksWrong=s.start==='2026-08-22'||s.start===BAD_DAY2;const hasPrematureData=!!s.days[BAD_DAY2]||!!s.health[BAD_DAY2];if(startLooksWrong||hasPrematureData){if(s.days[BAD_DAY2]){s.days[DAY1]=merge(s.days[DAY1]||{},s.days[BAD_DAY2]);delete s.days[BAD_
