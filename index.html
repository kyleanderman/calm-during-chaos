<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calm During Chaos">
  <link rel="manifest" href="manifest.json?v=daychip-v12">
  <link rel="apple-touch-icon" href="icon-180.png?v=daychip-v12">
  <title>Calm During Chaos</title>
  <style>
    html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-weight:800}
    #loading small{display:block;color:#7f8ba0;margin-top:8px;font-weight:500}
  </style>
</head>
<body>
<div id="loading"><div>Calm During Chaos<small>Restoring Day 1 safely and opening Day 2...</small></div></div>
<script>
(async()=>{
  const KEY='cdc-v3';
  const DAY1='2026-08-23';
  const EARLY='2026-08-22';
  const NEXT='2026-08-24';
  const MARK='cdc-day2-repair-v9';
  const ORIGINAL='cdc-v3-rescue-original-v9';
  const LATEST='cdc-v3-rescue-latest-v9';
  const REPAIRED='cdc-v3-rescue-repaired-v9';
  const CACHE_MARK='cdc-cache-reset-v12';
  const DATA_CACHE='cdc-data-rescue-v9';
  const RESCUE_DB='cdc-rescue-v9';
  const pad=n=>String(n).padStart(2,'0');
  const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const has=v=>v!==null&&v!==undefined&&v!=='';
  const hasContent=v=>!!v&&typeof v==='object'&&Object.keys(v).length>0;

  const mergeMoved=(target={},source={})=>{
    const out={...target};
    for(const [k,v] of Object.entries(source||{})){
      const cur=out[k];
      if(k==='drinks'||k==='pornMastCount') out[k]=(Number(cur)||0)+(Number(v)||0);
      else if(k==='customNeg'||k==='customPos'||k==='checkins') out[k]={...(v||{}),...(cur||{})};
      else if(['mood','clarity','calm','energy','xanax'].includes(k)){if(!has(cur)&&has(v))out[k]=v;}
      else if(typeof v==='boolean') out[k]=Boolean(cur||v);
      else if(Array.isArray(v)){if(!Array.isArray(cur)||!cur.length)out[k]=v;}
      else if(v&&typeof v==='object'&&cur&&typeof cur==='object'&&!Array.isArray(cur)) out[k]={...v,...cur};
      else if(!has(cur)&&has(v)) out[k]=v;
    }
    return out;
  };

  const overlayCurrent=(backup={},current={})=>{
    const out={...backup};
    for(const [k,v] of Object.entries(current||{})){
      const base=out[k];
      if(k==='customNeg'||k==='customPos'||k==='checkins') out[k]={...(base||{}),...(v||{})};
      else if(typeof v==='boolean') out[k]=Boolean(base||v);
      else if(Array.isArray(v)) out[k]=v.length?v:(Array.isArray(base)?base:v);
      else if(v&&typeof v==='object'&&base&&typeof base==='object'&&!Array.isArray(v)) out[k]={...base,...v};
      else if(has(v)) out[k]=v;
    }
    return out;
  };

  const idbPut=(raw,name)=>new Promise(resolve=>{
    try{
      const q=indexedDB.open(RESCUE_DB,1);
      q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('backups'))q.result.createObjectStore('backups');};
      q.onerror=()=>resolve();
      q.onsuccess=()=>{
        const db=q.result;
        try{
          const tx=db.transaction('backups','readwrite');
          tx.objectStore('backups').put(raw,name);
          tx.oncomplete=()=>{db.close();resolve();};
          tx.onerror=()=>{db.close();resolve();};
        }catch(e){db.close();resolve();}
      };
    }catch(e){resolve();}
  });

  const idbGet=(dbName,name)=>new Promise(resolve=>{
    try{
      const q=indexedDB.open(dbName,1);
      q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('backups'))q.result.createObjectStore('backups');};
      q.onerror=()=>resolve(null);
      q.onsuccess=()=>{
        const db=q.result;
        try{
          const tx=db.transaction('backups','readonly');
          const r=tx.objectStore('backups').get(name);
          r.onsuccess=()=>{db.close();resolve(r.result||null);};
          r.onerror=()=>{db.close();resolve(null);};
        }catch(e){db.close();resolve(null);}
      };
    }catch(e){resolve(null);}
  });

  const cachePut=async(raw,name)=>{
    try{
      if(!('caches'in window))return;
      const c=await caches.open(DATA_CACHE);
      await c.put('./__'+name+'.json',new Response(raw,{headers:{'Content-Type':'application/json','Cache-Control':'no-store'}}));
    }catch(e){}
  };

  const cacheGet=async(cacheName,name)=>{
    try{
      if(!('caches'in window))return null;
      const c=await caches.open(cacheName);
      const r=await c.match('./__'+name+'.json');
      return r?await r.text():null;
    }catch(e){return null;}
  };

  const normalizeCandidate=obj=>{
    const c=JSON.parse(JSON.stringify(obj||{}));
    c.days=c.days||{};
    c.health=c.health||{};
    const start=c.start;
    const move=(from)=>{
      if(c.days[from]){c.days[DAY1]=mergeMoved(c.days[DAY1]||{},c.days[from]);delete c.days[from];}
      if(c.health[from]){c.health[DAY1]={...c.health[from],...(c.health[DAY1]||{})};delete c.health[from];}
    };
    if(EARLY!==DAY1) move(EARLY);
    if(start===NEXT&&!hasContent(c.days[DAY1])&&!hasContent(c.health[DAY1])) move(NEXT);
    c.start=DAY1;
    return c;
  };

  const scoreCandidate=c=>{
    try{return JSON.stringify(c.days?.[DAY1]||{}).length+JSON.stringify(c.health?.[DAY1]||{}).length;}
    catch(e){return 0;}
  };

  try{
    let raw=null;
    try{
      raw=localStorage.getItem(KEY);
      if(raw){
        if(!localStorage.getItem(ORIGINAL))localStorage.setItem(ORIGINAL,raw);
        localStorage.setItem(LATEST,raw);
        localStorage.setItem('cdc-v3-rescue-meta-v9',JSON.stringify({savedAt:new Date().toISOString(),localDate:localISO(),bytes:raw.length}));
        await idbPut(raw,'original');
        await cachePut(raw,'original');
      }
    }catch(e){console.error('Data backup',e);}

    try{
      if(raw&&!localStorage.getItem(MARK)){
        const s=JSON.parse(raw);
        s.days=s.days||{};
        s.health=s.health||{};
        const originalStart=s.start;
        const hadDay1Before=hasContent(s.days[DAY1])||hasContent(s.health[DAY1]);
        const moved=[];
        const moveDate=d=>{
          let changed=false;
          if(s.days[d]){s.days[DAY1]=mergeMoved(s.days[DAY1]||{},s.days[d]);delete s.days[d];changed=true;}
          if(s.health[d]){s.health[DAY1]={...s.health[d],...(s.health[DAY1]||{})};delete s.health[d];changed=true;}
          if(changed)moved.push(d);
        };

        moveDate(EARLY);
        if(originalStart===NEXT&&!hadDay1Before)moveDate(NEXT);

        const priorRaws=[
          localStorage.getItem('cdc-v3-rescue-original-v8'),
          localStorage.getItem('cdc-v3-rescue-repaired-v8'),
          localStorage.getItem('cdc-v3-rescue-latest-v8'),
          await idbGet('cdc-rescue-v8','original'),
          await idbGet('cdc-rescue-v8','repaired'),
          await cacheGet('cdc-data-rescue-v8','original'),
          await cacheGet('cdc-data-rescue-v8','repaired')
        ].filter(Boolean);

        let best=null,bestScore=0;
        for(const candidateRaw of priorRaws){
          try{
            const candidate=normalizeCandidate(JSON.parse(candidateRaw));
            const score=scoreCandidate(candidate);
            if(score>bestScore){best=candidate;bestScore=score;}
          }catch(e){}
        }

        if(best&&bestScore>0){
          if(hasContent(best.days?.[DAY1])) s.days[DAY1]=overlayCurrent(best.days[DAY1],s.days[DAY1]||{});
          if(hasContent(best.health?.[DAY1])) s.health[DAY1]={...best.health[DAY1],...(s.health[DAY1]||{})};
        }

        s.start=DAY1;
        const fixed=JSON.stringify(s);
        localStorage.setItem(KEY,fixed);
        localStorage.setItem(REPAIRED,fixed);
        localStorage.setItem(MARK,JSON.stringify({repairedAt:new Date().toISOString(),localDate:localISO(),moved,recoveredPriorBackup:Boolean(best&&bestScore>0)}));
        await idbPut(fixed,'repaired');
        await cachePut(fixed,'repaired');
        raw=fixed;
      }
    }catch(e){console.error('Day 2 repair',e);}

    try{
      if('caches'in window&&!localStorage.getItem(CACHE_MARK)){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k!==DATA_CACHE&&!k.startsWith('cdc-data-rescue-')).map(k=>caches.delete(k)));
        localStorage.setItem(CACHE_MARK,'1');
      }
    }catch(e){}

    const files=['app-part-1.txt','app-part-2.txt','app-part-3.txt'];
    const stamp=Date.now();
    const chunks=await Promise.all(files.map(f=>fetch(f+'?v=daychip-v12-'+stamp,{cache:'no-store'}).then(r=>{
      if(!r.ok)throw new Error('Could not load app');
      return r.text();
    })));
    const b64=chunks.join('').replace(/\s/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream'in window))throw new Error('Please update Safari');
    let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();

    html=html
      .replace(/60[\s‐‑‒–—-]+DAY[\s‐‑‒–—-]+RESET/g,'60-DAY JOURNEY')
      .replace(/60[\s‐‑‒–—-]+day[\s‐‑‒–—-]+reset/gi,'60-day journey');

    const navStyle=`<style id="cdc-day-nav-style">
[data-cdc-day-toggle="1"]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cdc-day-nav-arrow{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;margin:0 4px;border:1px solid rgba(255,255,255,.13);border-radius:8px;background:rgba(255,255,255,.055);color:inherit;font:inherit;font-size:20px;line-height:1;padding:0 0 2px;vertical-align:middle;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cdc-day-nav-arrow:active:not(:disabled){transform:scale(.94);background:rgba(255,255,255,.11)}
.cdc-day-nav-arrow:disabled{opacity:.2;cursor:default}
</style>`;

    const navCode=`(()=>{try{
if(typeof S==='undefined'||typeof render!=='function'||typeof todayISO!=='function'||typeof addDays!=='function')return;
if(S.start!=='2026-08-23'){S.start='2026-08-23';if(typeof save==='function')save()}
const start='2026-08-23';
let open=false,dayEl=null,timer=null;
const clean=x=>(x||'').trim().replace(/\\s+/g,' ');
const isDayText=t=>/^DAY\\s+\\d+\\s+(?:OF|OUT OF)\\s+60$/i.test(clean(t));
const findDayEl=()=>{const els=[...document.querySelectorAll('body *')];return els.find(el=>!el.classList.contains('cdc-day-nav-arrow')&&isDayText(el.textContent)&&![...el.children].some(ch=>isDayText(ch.textContent)))||null};
const clearArrows=()=>document.querySelectorAll('.cdc-day-nav-arrow').forEach(x=>x.remove());
const clamp=()=>{const today=todayISO();if(selected<start)selected=start;if(selected>today)selected=today};
const go=dir=>{const target=addDays(selected,dir),today=todayISO();if(target<start||target>today)return;selected=target;render();setTimeout(bind,0)};
const showArrows=()=>{clearArrows();if(!open||!dayEl||!dayEl.isConnected)return;const today=todayISO();const left=document.createElement('button'),right=document.createElement('button');left.type=right.type='button';left.className=right.className='cdc-day-nav-arrow';left.textContent='‹';right.textContent='›';left.setAttribute('aria-label','Previous day');right.setAttribute('aria-label','Next day');left.disabled=selected<=start;right.disabled=selected>=today;left.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(-1)});right.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(1)});dayEl.insertAdjacentElement('beforebegin',left);dayEl.insertAdjacentElement('afterend',right)};
const bind=()=>{clamp();const found=findDayEl();if(!found){clearArrows();return}dayEl=found;if(dayEl.dataset.cdcDayToggle!=='1'){dayEl.dataset.cdcDayToggle='1';dayEl.setAttribute('role','button');dayEl.setAttribute('aria-label','Change day');dayEl.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();open=!open;showArrows()})}showArrows()};
document.addEventListener('click',e=>{if(open&&!e.target.closest('[data-cdc-day-toggle="1"],.cdc-day-nav-arrow')){open=false;clearArrows()}},true);
const obs=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(bind,0)});obs.observe(document.body,{childList:true,subtree:true,characterData:true});
clamp();bind();
}catch(e){console.error('Inline day navigation',e)}})();`;

    html=html.replace('</head>',navStyle+'</head>');
    const navScript='<scr'+'ipt>'+navCode+'</scr'+'ipt>';
    html=html.replace('</body>',navScript+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div>Could not load Calm During Chaos<small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
