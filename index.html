<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#07090e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calm During Chaos"><link rel="manifest" href="manifest.json?v=data-rescue-v8"><link rel="apple-touch-icon" href="icon-180.png?v=data-rescue-v8"><title>Calm During Chaos</title><style>html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-weight:800}#loading small{display:block;color:#7f8ba0;margin-top:8px;font-weight:500}</style></head><body><div id="loading"><div>Calm During Chaos<small>Protecting your saved data and loading the app...</small></div></div><script>(async()=>{const KEY='cdc-v3',DAY1='2026-08-23',EARLY='2026-08-22',NEXT='2026-08-24',MARK='cdc-day1-data-rescue-v8',ORIGINAL='cdc-v3-rescue-original-v8',LATEST='cdc-v3-rescue-latest-v8',REPAIRED='cdc-v3-rescue-repaired-v8',CACHE_MARK='cdc-cache-reset-v8',DATA_CACHE='cdc-data-rescue-v8';const pad=n=>String(n).padStart(2,'0'),localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const has=v=>v!==null&&v!==undefined&&v!=='';const merge=(target={},source={})=>{const o={...target};for(const[k,v]of Object.entries(source||{})){const cur=o[k];if(k==='drinks'||k==='pornMastCount'){o[k]=(Number(cur)||0)+(Number(v)||0)}else if(k==='customNeg'||k==='customPos'||k==='checkins'){o[k]={...(v||{}),...(cur||{})}}else if(['mood','clarity','calm','energy','xanax'].includes(k)){if(!has(cur)&&has(v))o[k]=v}else if(typeof v==='boolean'){o[k]=Boolean(cur||v)}else if(Array.isArray(v)){if(!Array.isArray(cur)||!cur.length)o[k]=v}else if(v&&typeof v==='object'&&cur&&typeof cur==='object'&&!Array.isArray(cur)){o[k]={...v,...cur}}else if(!has(cur)&&has(v)){o[k]=v}}return o};const idbPut=(raw,name)=>new Promise(resolve=>{try{const q=indexedDB.open('cdc-rescue-v8',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('backups'))q.result.createObjectStore('backups')};q.onerror=()=>resolve();q.onsuccess=()=>{const db=q.result;try{const tx=db.transaction('backups','readwrite');tx.objectStore('backups').put(raw,name);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();resolve()}}catch(e){db.close();resolve()}}}catch(e){resolve()}});const cachePut=async(raw,name)=>{try{if(!('caches'in window))return;const c=await caches.open(DATA_CACHE);await c.put('./__'+name+'.json',new Response(raw,{headers:{'Content-Type':'application/json','Cache-Control':'no-store'}}))}catch(e){}};try{let raw=null;try{raw=localStorage.getItem(KEY);if(raw){if(!localStorage.getItem(ORIGINAL))localStorage.setItem(ORIGINAL,raw);localStorage.setItem(LATEST,raw);localStorage.setItem('cdc-v3-rescue-meta-v8',JSON.stringify({savedAt:new Date().toISOString(),localDate:localISO(),bytes:raw.length}));await idbPut(raw,'original');await cachePut(raw,'original')}}catch(e){console.error('Data backup',e)}try{if(raw&&!localStorage.getItem(MARK)){const s=JSON.parse(raw);s.days=s.days||{};s.health=s.health||{};const moved=[];const moveDate=d=>{let changed=false;if(s.days[d]){s.days[DAY1]=merge(s.days[DAY1]||{},s.days[d]);delete s.days[d];changed=true}if(s.health[d]){s.health[DAY1]={...s.health[d],...(s.health[DAY1]||{})};delete s.health[d];changed=true}if(changed)moved.push(d)};moveDate(EARLY);if(localISO()===DAY1)moveDate(NEXT);if(s.start===EARLY||(localISO()===DAY1&&s.start===NEXT))s.start=DAY1;const fixed=JSON.stringify(s);localStorage.setItem(KEY,fixed);localStorage.setItem(REPAIRED,fixed);localStorage.setItem(MARK,JSON.stringify({repairedAt:new Date().toISOString(),localDate:localISO(),moved}));await idbPut(fixed,'repaired');await cachePut(fixed,'repaired');raw=fixed}}catch(e){console.error('Day 1 rescue',e)}try{if('caches'in window&&!localStorage.getItem(CACHE_MARK)){const keys=await caches.keys();await Promise.all(keys.filter(k=>k!==DATA_CACHE&&!k.startsWith('cdc-data-rescue-')).map(k=>caches.delete(k)));localStorage.setItem(CACHE_MARK,'1')}}catch(e){}const files=['app-part-1.txt','app-part-2.txt','app-part-3.txt'],stamp=Date.now();const chunks=await Promise.all(files.map(f=>fetch(f+'?v=data-rescue-v8-'+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load app');return r.text()})));const b64=chunks.join('').replace(/\s/g,''),bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Please update Safari');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div>Could not load Calm During Chaos<small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
