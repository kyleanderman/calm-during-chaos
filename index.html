<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calm During Chaos"><title>Calm During Chaos</title><style>html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;font-weight:800}#loading small{display:block;color:#7f8ba0;margin-top:8px;font-weight:500}</style></head><body><div id="loading"><div>Calm During Chaos<small>Loading your 60-day reset…</small></div></div><script>(async()=>{try{const files=['app-part-1.txt','app-part-2.txt','app-part-3.txt'];const chunks=await Promise.all(files.map(f=>fetch(f+'?v=day1').then(r=>{if(!r.ok)throw new Error('Could not load app');return r.text()})));const b64=chunks.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Please update Safari');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div>Could not load Calm During Chaos<small>'+String(e.message||e)+'</small></div>'}})();</script></body></html>
