<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><title>Calm During Chaos Data Rescue</title><style>html,body{margin:0;background:#07090e;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:560px;margin:auto;padding:28px 20px 48px}h1{font-size:26px;margin:10px 0}p{color:#aeb7c8;line-height:1.45}.card{background:#111620;border:1px solid #283142;border-radius:16px;padding:16px;margin:14px 0}.ok{color:#6ee7a8;font-weight:800}.bad{color:#ff9a9a;font-weight:800}button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:14px 16px;margin-top:10px;background:#f5f7fb;color:#07090e;font-weight:800;text-align:center;text-decoration:none;font-size:16px}.secondary{background:#202938!important;color:#f5f7fb!important}small{color:#7f8ba0}</style></head><body><main><h1>Data Rescue</h1><p>This page reads only the Calm During Chaos backups stored on this device. It does not erase or overwrite anything.</p><div class="card"><div id="original">Checking exact backup...</div><small id="originalMeta"></small><button id="downloadOriginal" hidden>Download exact backup</button></div><div class="card"><div id="repaired">Checking rescued copy...</div><small id="repairedMeta"></small><button id="downloadRepaired" hidden>Download rescued copy</button></div><div class="card"><div id="current">Checking current app data...</div><small id="currentMeta"></small><button id="downloadCurrent" hidden>Download current copy</button></div><a class="btn secondary" href="./">Return to Calm During Chaos</a></main><script>(()=>{const getIDB=name=>new Promise(resolve=>{try{const q=indexedDB.open('cdc-rescue-v8',1);q.onerror=()=>resolve(null);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('backups'))q.result.createObjectStore('backups')};q.onsuccess=()=>{const db=q.result;try{const tx=db.transaction('backups','readonly'),r=tx.objectStore('backups').get(name);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();resolve(null)}}catch(e){db.close();resolve(null)}}}catch(e){resolve(null)}});const getCache=async name=>{try{const c=await caches.open('cdc-data-rescue-v8'),r=await c.match('./__'+name+'.json');return r?await r.text():null}catch(e){return null}};const choose=async(name,localKey)=>localStorage.getItem(localKey)||await getIDB(name)||await getCache(name);const show=(id,metaId,btnId,raw,label)=>{const el=document.getElementById(id),meta=document.getElementById(metaId),btn=document.getElementById(btnId);if(raw){el.textContent=label+' found';el.className='ok';meta.textContent=raw.length.toLocaleString()+' bytes stored on this device';btn.hidden=false;btn.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='calm-during-chaos-'+id+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}else{el.textContent=label+' not found in this browser/app storage';el.className='bad';meta.textContent='If you opened this page in Safari, the Home Screen app may have separate storage.'}};(async()=>{const original=await choose('original','cdc-v3-rescue-original-v8'),repaired=await choose('repaired','cdc-v3-rescue-repaired-v8'),current=localStorage.getItem('cdc-v3');show('original','originalMeta','downloadOriginal',original,'Exact pre-repair backup');show('repaired','repairedMeta','downloadRepaired',repaired,'Rescued copy');show('current','currentMeta','downloadCurrent',current,'Current app data')})()})();</script></body></html>
