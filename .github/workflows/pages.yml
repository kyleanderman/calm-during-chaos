name: Deploy Calm During Chaos

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'DEPLOY CALM DURING CHAOS' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow started
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'issues' ? context.issue.number : 9
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `STARTED ${context.eventName} ${context.sha}`
            })
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload exact static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm deployment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.eventName === 'issues' ? context.issue.number : 9
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `DEPLOYED ${context.eventName} ${context.sha}`
            })
